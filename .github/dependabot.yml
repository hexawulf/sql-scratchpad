# Dependabot version updates (security updates are enabled in repo settings).
# Weekly, grouped so routine updates open a single PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei

  - package-ecosystem: docker
    directory: /db
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    ignore:
      # Stay on the MariaDB 11.4 LTS line (supported until 2029): only 11.4.x
      # patch and digest updates. A server line change (11.8 / 12.x LTS, or the
      # rolling 13.x) needs a planned dump -> upgrade -> restore, not a bump.
      - dependency-name: mariadb
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
