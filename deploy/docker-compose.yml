name: sql-scratchpad

services:
  db:
    image: 0xwulf/sql-scratchpad-db:0.3.8@sha256:f39abf03dc47ab122bb73aea3b6e2ce3baf1952b6f7b7f42852019bf6e6b04b9
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - sql-scratchpad-db:/var/lib/mysql
    networks:
      - internal
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/mysqld:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - 'no-new-privileges:true'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  app:
    image: 0xwulf/sql-scratchpad:0.3.8@sha256:6ee39a655cb73e1da8e47d27b96e4833ae155c648115779b101bdeae5919d503
    restart: unless-stopped
    env_file:
      - app.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:5050:5050'
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    mem_limit: 192m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  internal:
    internal: true
  edge: {}

volumes:
  sql-scratchpad-db: {}
