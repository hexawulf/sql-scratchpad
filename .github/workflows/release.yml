name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI on Tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Build & Publish Multi-Arch Images
    if: github.repository == 'hexawulf/sql-scratchpad'
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag format, main ancestry, and package.json version
        id: rev
        env:
          TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vX.Y.Z (got: $TAG)"
            exit 1
          fi
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$TARGET_SHA" ]; then
            echo "::error::Checked-out HEAD (${head_sha}) does not match github.sha (${TARGET_SHA})"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/main; then
            echo "::error::Tagged commit (${TARGET_SHA}) is not an ancestor of origin/main"
            exit 1
          fi
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v${pkg_version}" != "$TAG" ]; then
            echo "::error::package.json version (${pkg_version}) does not match tag (${TAG})"
            exit 1
          fi
          {
            echo "version=${pkg_version}"
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "full_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata (app)
        id: meta_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: 0xwulf/sql-scratchpad
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=SQL Scratchpad
            org.opencontainers.image.description=Letos-style SQL playground in the browser backed by isolated MariaDB 11.4 workspaces
            org.opencontainers.image.source=https://github.com/hexawulf/sql-scratchpad
            org.opencontainers.image.url=https://sql-scratchpad.com
            org.opencontainers.image.version=${{ steps.rev.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.full_sha }}
            org.opencontainers.image.licenses=MIT

      - name: Docker metadata (db)
        id: meta_db
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: 0xwulf/sql-scratchpad-db
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=SQL Scratchpad DB
            org.opencontainers.image.description=MariaDB 11.4 LTS database image for SQL Scratchpad with isolated workspace setup
            org.opencontainers.image.source=https://github.com/hexawulf/sql-scratchpad
            org.opencontainers.image.url=https://sql-scratchpad.com
            org.opencontainers.image.version=${{ steps.rev.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.full_sha }}
            org.opencontainers.image.licenses=MIT

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.rev.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push db image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: db/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_db.outputs.tags }}
          labels: ${{ steps.meta_db.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

      - name: Sync Docker Hub description (app)
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: 0xwulf/sql-scratchpad
          short-description: Letos-style SQL playground in the browser backed by isolated MariaDB 11.4 workspaces
          readme-filepath: ./README.md
          enable-url-completion: true

      - name: Sync Docker Hub description (db)
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: 0xwulf/sql-scratchpad-db
          short-description: MariaDB 11.4 LTS database image for SQL Scratchpad with isolated workspace setup
          readme-filepath: ./docs/DOCKERHUB-DB.md
          enable-url-completion: true
