name: sql-scratchpad-dev

services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - sql-scratchpad-dev-db:/var/lib/mysql
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/mysqld:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - 'no-new-privileges:true'
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  sql-scratchpad-dev-db: {}
